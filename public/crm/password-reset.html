<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>نطاق CRM | تعيين كلمة المرور</title>
<link rel="icon" href="../NITAQ-Logo-gold.svg" type="image/svg+xml">
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#132a46;background:#eeedea;font-size:16px}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
main{width:min(440px,100%);padding:28px;background:#fff;border:1px solid #d8d7d1;border-radius:8px;box-shadow:0 8px 24px #00000012}
img{display:block;width:100px;margin:0 auto 24px}h1{font-size:23px;margin:0 0 16px}p{line-height:1.8;color:#4c617d}
label{display:block;margin:20px 0 8px}input,button,.back{font:inherit;width:100%;min-height:48px;border-radius:5px}
input{padding:12px;border:1px solid #8794a6}button{margin-top:24px;background:#132a46;color:white;border:0;cursor:pointer;font-weight:bold}
button:disabled{background:#54677e;cursor:wait}.back{display:block;margin-top:16px;text-align:center;padding:12px;color:#132a46}
:focus-visible{outline:3px solid #9a7434;outline-offset:3px}[hidden]{display:none!important}#message{min-height:1.8em}
</style>
</head>
<body>
<main>
<img src="../NITAQ-Logo-gold.svg" alt="نطاق">
<h1>تعيين كلمة مرور CRM</h1>
<p id="message" role="status" aria-live="polite">جارٍ التحقق من رابط الاستعادة…</p>
<form id="resetForm" hidden>
<label for="password">كلمة المرور الجديدة</label>
<input id="password" type="password" minlength="12" autocomplete="new-password" required aria-describedby="passwordHelp">
<p id="passwordHelp">استخدم كلمة مرور قوية لا تقل عن 12 حرفًا.</p>
<label for="confirmPassword">تأكيد كلمة المرور</label>
<input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
<button id="savePassword" type="submit">حفظ كلمة المرور</button>
</form>
<a class="back" href="index.html">الرجوع إلى CRM</a>
</main>
<script src="../vendor/supabase-2.45.3.min.js"></script>
<script src="password-reset.js?v=20261123-recovery"></script>
</body>
</html>
