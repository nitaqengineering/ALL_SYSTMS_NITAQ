{
  const topBar = document.querySelector('#table-scroll-top');
  const table = document.querySelector('#table');
  const viewport = table.parentElement;
  function refreshScrollBar() {
    topBar.hidden = viewport.scrollWidth <= viewport.clientWidth;
    topBar.style.width = viewport.clientWidth + 'px';
    topBar.firstElementChild.style.width = viewport.scrollWidth + 'px';
    topBar.scrollLeft = viewport.scrollLeft;
  }
  topBar.addEventListener('scroll', () => {
    if (!topBar.hidden && viewport.scrollLeft !== topBar.scrollLeft) viewport.scrollLeft = topBar.scrollLeft;
  });
  viewport.addEventListener('scroll', () => {
    if (topBar.scrollLeft !== viewport.scrollLeft) topBar.scrollLeft = viewport.scrollLeft;
  });
  const resize = new ResizeObserver(refreshScrollBar);
  resize.observe(table);
  resize.observe(viewport);
  refreshScrollBar();
}
