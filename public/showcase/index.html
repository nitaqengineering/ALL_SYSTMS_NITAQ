<style>
@font-face{font-family:Tajawal;font-weight:300;src:url(../studio/assets/fonts/tajawal-arabic-300-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Tajawal;font-weight:400;src:url(../studio/assets/fonts/tajawal-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Tajawal;font-weight:500;src:url(../studio/assets/fonts/tajawal-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Tajawal;font-weight:300;src:url(../studio/assets/fonts/tajawal-latin-300-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Tajawal;font-weight:400;src:url(../studio/assets/fonts/tajawal-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Tajawal;font-weight:500;src:url(../studio/assets/fonts/tajawal-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--navy:#101725;--navy2:#172033;--gold:#C9A25D;--white:#fff;--steel:#6E7787;--concrete:#EEEDEA;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--navy);color:var(--white);font-family:Tajawal,system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr;height:100%;min-height:560px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line)}
header img{height:30px;display:block}
.hd-meta{font-size:12px;letter-spacing:.14em;color:var(--steel);text-transform:uppercase}
.hd-actions{display:flex;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;transition:.2s}
.chip:hover{border-color:var(--gold);color:var(--gold)}
main{display:grid;grid-template-columns:1fr 360px;min-height:0}
.stage{position:relative;min-height:0;overflow:hidden;background:var(--concrete);transition:background .5s}
.night .stage{background:#0B101B}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;font-size:12px;line-height:1.25;color:var(--navy);background:rgba(255,255,255,.86);padding:4px 9px;border-radius:6px;transition:opacity .2s}
.lbl small{display:block;color:var(--steel);font-size:10.5px}
.lbl.note{background:rgba(16,23,37,.82);color:#fff;letter-spacing:.02em}
.lbl.on{background:var(--gold);color:var(--navy)}
.lbl.on small{color:var(--navy)}
.title{position:absolute;top:20px;inset-inline-start:24px;color:var(--navy);pointer-events:none;transition:color .5s}
.night .title{color:var(--white)}
.title .k{font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.title h1{font-size:26px;font-weight:500;margin-top:4px}
.title p{font-size:13px;color:var(--steel);margin-top:2px}
.badge{display:inline-block;margin-top:8px;font-size:11px;border:1px solid var(--gold);color:var(--gold);padding:2px 8px;border-radius:4px}
.levels{display:flex;gap:6px;padding-inline-start:6px;border-inline-start:1px solid rgba(255,255,255,.15)}
.dock{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none;display:flex;gap:6px;background:var(--navy);padding:6px;border-radius:12px;box-shadow:0 8px 30px rgba(16,23,37,.25)}
.btn{padding:9px 12px;border-radius:8px;font-size:13px;color:#C9CED8;transition:.2s;white-space:nowrap}
.btn:hover{color:var(--white)}
.btn.on{background:var(--gold);color:var(--navy);font-weight:500}
.hint{position:absolute;bottom:26px;inset-inline-start:24px;font-size:11px;color:var(--steel)}
aside{overflow:auto;border-inline-start:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:22px}
.sec-k{font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fact{background:var(--navy);padding:14px}
.fact b{display:block;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--steel)}
.rooms{list-style:none;padding:0;display:flex;flex-direction:column}
.rooms li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px;font-size:14px;transition:.15s}
.rooms li:hover,.rooms li.on{background:var(--navy2)}
.rooms li.on{color:var(--gold)}
.rooms li span{color:var(--steel);font-size:12.5px;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;padding:12px 10px;font-weight:500}
.total span{color:var(--gold);font-variant-numeric:tabular-nums}
.cta{display:block;text-align:center;background:var(--gold);color:var(--navy);font-weight:500;padding:13px;border-radius:10px;text-decoration:none;margin-top:auto}
.foot{font-size:11px;color:var(--steel);line-height:1.6}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--navy);color:var(--white);padding:10px 18px;border-radius:999px;font-size:13px}
.here{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold);padding:8px 16px;border-radius:999px;font-size:13px;pointer-events:none;display:none}
.walking .here:not([hidden]){display:block}
.stage canvas.map{position:absolute;bottom:84px;right:24px;width:170px;height:170px;border-radius:12px;background:#CFCBC3;border:2px solid var(--navy);box-shadow:0 8px 24px rgba(16,23,37,.25);display:none;cursor:pointer;touch-action:none}
.walking .stage canvas.map{display:block}
.walkctl{position:absolute;left:24px;bottom:84px;width:210px;background:rgba(16,23,37,.88);color:#fff;border-radius:12px;padding:10px 12px;display:none;flex-direction:column;gap:6px;font-size:11.5px;box-shadow:0 8px 24px rgba(16,23,37,.25)}
.walking .walkctl{display:flex}
.walkctl label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.walkctl label b{font-weight:500;color:var(--gold);font-variant-numeric:tabular-nums}
.walkctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold)}
.walkctl .chk{display:flex;gap:6px;align-items:center;color:#C9CED8}
.walking .title{opacity:0}
.walking .hint{bottom:78px;inset-inline-start:50%;transform:translateX(50%);background:rgba(16,23,37,.7);color:#fff;padding:6px 12px;border-radius:999px;white-space:nowrap}
[dir=ltr] .walking .hint{transform:translateX(-50%)}
.walking .stage canvas{cursor:crosshair}
.failed aside,.failed .hd-actions{display:none}
.failed main{grid-template-columns:1fr}
.failed .err{display:flex;align-items:center;justify-content:center;height:100%;min-height:50vh;font-size:16px;color:var(--navy);padding:24px}
.realfurn{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:10px;color:var(--white)}
.realfurn input{accent-color:var(--gold)}
.fins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fin{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;text-align:start;transition:.15s}
.fin:hover{border-color:var(--steel)}
.fin.on{border-color:var(--gold);color:var(--gold)}
.sw{display:flex;flex:none}
.sw i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.25);margin-inline-end:-4px}
.err{padding:40px;text-align:center;color:var(--steel)}
.toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:rgba(16,23,37,.88);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:4;white-space:nowrap}
.toast.on{opacity:1}
.hint.coach{display:block!important;left:50%;inset-inline-start:auto;right:auto;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));background:rgba(16,23,37,.85);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;z-index:4;animation:coach 6s ease forwards;pointer-events:none}
@keyframes coach{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
.walking .hint.coach{bottom:calc(210px + env(safe-area-inset-bottom))}
/* phone-only controls (shown by the media query below) */
.hud,.joy,#bMore,.grab,.scrim{display:none}
.hud{position:absolute;top:12px;inset-inline-end:12px;flex-direction:column;gap:8px;z-index:3}
.fab{width:40px;height:40px;border-radius:50%;background:rgba(16,23,37,.82);color:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(16,23,37,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation}
.fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab.on{background:var(--gold);color:var(--navy)}
.joy{position:absolute;left:18px;width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,rgba(16,23,37,.18),rgba(16,23,37,.42));border:1.5px solid rgba(255,255,255,.45);touch-action:none;align-items:center;justify-content:center;z-index:3;-webkit-user-select:none;user-select:none}
.joy i{width:52px;height:52px;border-radius:50%;background:var(--gold);box-shadow:0 6px 18px rgba(16,23,37,.35);pointer-events:none;transition:transform .12s}
.joy.on i{transition:none}
@media(max-width:860px){
  /* Phones: the model fills the screen like a game; details open as a sheet; one slim bar. */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  .app{height:100vh;height:100dvh;min-height:0;grid-template-rows:auto 1fr}
  main{grid-template-columns:1fr;min-height:0}
  .stage{height:auto;min-height:0}
  header{padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}header img{height:24px}.hd-meta{display:none}.chip{padding:5px 11px;font-size:12px}

  .title{inset-inline-start:14px;top:12px}.title h1{font-size:16px}.title p,.title .k{display:none}
  .hud{display:flex}
  .dock{bottom:calc(10px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100% - 20px);flex-wrap:nowrap;justify-content:center;gap:4px;padding:4px;border-radius:14px;background:rgba(16,23,37,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .dock.more{flex-wrap:wrap}
  .btn{padding:8px 12px;font-size:12.5px}
  #bMore{display:block;font-size:16px;line-height:1;padding:6px 12px}
  .dock:not(.more) #bRotate,.dock:not(.more) #bWalls,.dock:not(.more) #bFurn,.dock:not(.more) #bReset{display:none}
  .levels{position:absolute;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));flex-direction:column-reverse;gap:6px;padding:0;border:0;z-index:2}
  .levels .btn{background:rgba(16,23,37,.82);color:#C9CED8;border-radius:10px;padding:7px 10px;font-size:11.5px;box-shadow:0 4px 14px rgba(16,23,37,.25)}
  .levels .btn.on{background:var(--gold);color:var(--navy)}
  .hint{display:none}
  .walking .joy{display:flex;bottom:calc(76px + env(safe-area-inset-bottom))}
  .stage canvas.map{width:150px;height:150px;top:12px;bottom:auto!important;left:auto;right:62px}
  .walking .stage canvas.map{display:none}
  .walking.map-open .stage canvas.map{display:block}
  .walkctl{left:auto;right:62px;top:12px;bottom:auto!important;width:190px;padding:8px 10px;font-size:11px}
  .walking .walkctl{display:none}
  .walking .hud{inset-inline-start:auto;inset-inline-end:auto;right:12px} /* stick on the left, buttons on the right */
  .walking.set-open .walkctl{display:flex}
  .here{top:12px;font-size:12px;padding:6px 12px;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #fMap,#fSet{display:none}
  .walking #fMap,.walking #fSet{display:flex}
  /* details sheet */
  aside{position:fixed;left:0;right:0;bottom:0;max-height:78dvh;z-index:20;background:var(--navy);border:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
  .sheet aside{transform:none}
  .grab{display:block;width:100%;padding:6px 0 4px;position:sticky;top:-8px;background:var(--navy);z-index:1}
  .grab i{display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;opacity:0;pointer-events:none;transition:opacity .3s}
  .sheet .scrim{opacity:1;pointer-events:auto}
}
@media(max-width:860px) and (max-height:500px){ /* phone held sideways */
  .hud{flex-direction:row}
  .levels{top:60px;bottom:auto}
  .stage canvas.map,.walkctl{top:60px;right:12px}
  .stage canvas.map{width:130px;height:130px}
  .joy{width:108px;height:108px}.joy i{width:46px;height:46px}
  .walking .joy{bottom:calc(64px + env(safe-area-inset-bottom))}
  .title{display:none}
}
</style>
</head>

<script>
/* ?v=<owner link token>: the villa comes from the private showcase project (config.js).
   ?p=<project> loads data/<project>.js from this site (sample villa, or local testing). */
(function () {
  var q = new URLSearchParams(location.search), v = (q.get('v') || '').toLowerCase();
  var p = (q.get('p') || 'sample-villa').toLowerCase();
  if (!/^[a-z0-9-]{1,60}$/.test(p)) p = 'sample-villa';
  function load(src, next) { var s = document.createElement('script'); s.src = src; s.onload = s.onerror = next; document.body.appendChild(s); }
  function fail(msg) {
    document.getElementById('app').classList.add('failed');
    document.getElementById('stage').innerHTML = '<div class="err"></div>';
    document.querySelector('#stage .err').textContent = msg;
  }
  if (!v) { load('data/' + p + '.js', function () { load('showcase.js'); }); return; }
  var api = (window.NITAQ_SHOWCASE_API || '').replace(/\/+$/, '');
  if (!/^[a-z0-9-]{12,80}$/.test(v) || !api) { fail('هذا الرابط غير صالح. تواصل مع نطاق للحصول على رابط جديد.'); return; }
  fetch(api + '/functions/v1/showcase?v=' + encodeURIComponent(v), { cache: 'no-store' })
    .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, status: r.status, body: b }; }); })
    .then(function (r) {
      if (r.status === 404) throw new Error('هذا الرابط غير متاح حاليًا. تواصل مع نطاق.');
      if (!r.ok || !r.body.data) throw new Error('تعذّر تحميل المشروع الآن. حاول مرة أخرى بعد قليل.');
      window.NITAQ_SHOWCASE = r.body.data; load('showcase.js');
    })
    .catch(function (e) { fail(/[\u0600-\u06FF]/.test(e.message) ? e.message : 'تعذّر الاتصال. تأكد من الإنترنت وحاول مرة أخرى.'); });
})();
</script>
