name: Monitor live portal and database
# Runs every hour. A failure e-mails the repository owner (GitHub notification settings).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nitaq-monitor
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Supabase still provides everything the published frontend calls
        run: node scripts/check-live-contract.mjs --live
      - name: Portal and the four systems open
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          # --retry-all-errors so a transient GitHub Pages hiccup (e.g. a brief 404
          # during a deploy or CDN refresh) is retried instead of failing the run.
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors "$base/" | grep -q 'NITAQ-Logo-gold.svg'
          for page in accounting crm engineering studio; do
            curl -fsS --retry 6 --retry-delay 15 --retry-all-errors -o /dev/null "$base/$page/index.html"
          done
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$base/README.md")"
            [ "$code" = "404" ] && break
            [ "$attempt" = 6 ] && { echo "README.md returned $code, expected 404 after retries"; exit 1; }
            sleep 15
          done
          echo "Portal healthy at $base"
