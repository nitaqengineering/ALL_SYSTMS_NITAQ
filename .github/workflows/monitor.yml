name: Monitor live portal and database
# Runs every hour. A failure e-mails the repository owner (GitHub notification settings).
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nitaq-monitor
  cancel-in-progress: true
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Supabase still provides everything the published frontend calls
        run: node scripts/check-live-contract.mjs --live
      - name: Portal and the four systems open
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsS --retry 3 --retry-delay 10 "$base/" | grep -q 'NITAQ-Logo-gold.svg'
          for page in accounting crm engineering studio; do
            curl -fsS --retry 3 --retry-delay 10 -o /dev/null "$base/$page/index.html"
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/README.md")" = "404" ]
          echo "Portal healthy at $base"
