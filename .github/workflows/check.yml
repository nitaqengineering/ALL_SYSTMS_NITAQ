name: Check package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:database
        env:
          NITAQ_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/postgres
          NITAQ_TEST_ALLOW_DISPOSABLE: '1'
  backup-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: local-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Install PostgreSQL 17 client
        run: bash scripts/install-postgres-client.sh
      - name: Build a synthetic production-shaped database
        run: node scripts/backup-selftest.mjs
        env:
          NITAQ_TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/postgres
          NITAQ_TEST_ALLOW_DISPOSABLE: "1"
      - name: Dump, encrypt, decrypt, restore into a new database and compare
        run: bash scripts/backup-selftest.sh
