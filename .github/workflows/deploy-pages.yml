name: Publish frontend to GitHub Pages
# Runs on every push to main and on demand. GitHub Pages may make frontend assets publicly accessible, even for a private repository.
# Repository Settings > Pages > Source must be "GitHub Actions". With "Deploy from a branch" the
# automatic Jekyll build of the repository root replaces this deployment seconds after it finishes.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_fallback:
        description: 'Publish although an optional database function is missing (frontend uses its declared fallback)'
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - name: Live database must provide everything this frontend calls
        run: node scripts/check-live-contract.mjs --live ${{ inputs.allow_fallback && '--allow-fallback' || '' }}
        env:
          NITAQ_CONTRACT_ACCOUNTING_EMAIL: ${{ secrets.NITAQ_CONTRACT_ACCOUNTING_EMAIL }}
          NITAQ_CONTRACT_ACCOUNTING_PASSWORD: ${{ secrets.NITAQ_CONTRACT_ACCOUNTING_PASSWORD }}
          NITAQ_CONTRACT_CRM_EMAIL: ${{ secrets.NITAQ_CONTRACT_CRM_EMAIL }}
          NITAQ_CONTRACT_CRM_PASSWORD: ${{ secrets.NITAQ_CONTRACT_CRM_PASSWORD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Published site must be the portal, not the repository
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 18); do
            sleep 10
            ok=1
            curl -fsS "$base/?t=$attempt$RANDOM" | grep -q 'NITAQ-Logo-gold.svg' || ok=0
            for page in accounting crm engineering studio; do
              curl -fsS -o /dev/null "$base/$page/index.html?t=$attempt$RANDOM" || ok=0
            done
            # The repository root (README, SQL, sources) must not be what is served.
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/README.md?t=$attempt$RANDOM")" = "404" ] || ok=0
            [ "$ok" = 1 ] && echo "Portal and four systems are served from $base" && exit 0
          done
          echo "The address still does not serve the portal. Check Settings > Pages > Source = GitHub Actions and rerun."
          exit 1
